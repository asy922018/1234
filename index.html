<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>VSEPR 분자 구조 비교 시뮬레이터</title>
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; display: flex; }
        
        .view-container { position: relative; width: 50%; height: 100vh; border-right: 1px solid #333; overflow: hidden; }
        .view-container:last-child { border-right: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* 패널 레이아웃 */
        .panel { position: absolute; width: 230px; z-index: 10; pointer-events: auto; }
        .side-panel { top: 20px; }
        .left-panel { left: 20px; }
        .right-panel { right: 20px; }
        
        .bottom-panel { position: absolute; bottom: 20px; width: 250px; z-index: 10; }
        .left-bottom { left: 20px; }
        .right-bottom { right: 20px; }

        .group-box { border: 2px solid #666; border-radius: 12px; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.85); position: relative; }
        .group-title { position: absolute; top: -10px; left: 12px; background: #000; padding: 0 6px; font-size: 13px; font-weight: bold; color: #aaa; }
        
        .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .btn-group { display: flex; gap: 6px; align-items: center; }

        .btn-add { cursor: pointer; width: 24px; height: 24px; transition: transform 0.1s; }
        .btn-add:active { transform: scale(0.9); }
        .btn-remove { color: #ff4d4d; border: 1px solid #ff4d4d; border-radius: 4px; width: 20px; height: 20px; text-align: center; cursor: pointer; line-height: 18px; font-weight: bold; background: none; }
        
        .clear-btn { background: #f1c40f; color: #000; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; font-size: 13px; }

        .name-label { color: #f1c40f; font-weight: bold; font-size: 16px; display: block; margin-top: 4px; min-height: 20px; }
        label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .angle-tag { position: absolute; color: #00ff00; font-weight: bold; font-size: 15px; pointer-events: none; text-shadow: 2px 2px 2px #000; z-index: 5; }
        .view-title { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; color: #666; pointer-events: none; }
    </style>
</head>
<body>

<script>
    // UI 동적 생성 함수
    function renderView(id, sideName) {
        document.write(`
        <div class="view-container" id="container-${id}">
            <div class="view-title">분자 ${sideName}</div>
            <div class="panel side-panel ${id === 'A' ? 'left-panel' : 'right-panel'}">
                <div class="group-box">
                    <span class="group-title">결합</span>
                    ${['bond1', 'bond2', 'bond3'].map((type, idx) => `
                        <div class="control-row">
                            <div class="label-text">${['단일 —', '이중 ═', '삼중 ≡'][idx]}</div>
                            <div class="btn-group">
                                <button class="btn-remove" onclick="removeDomain('${id}','${type}')">×</button>
                                <img src="https://img.icons8.com/ios-glyphs/30/ffffff/plus-math.png" class="btn-add" onclick="addDomain('${id}','${type}')">
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="group-box">
                    <span class="group-title">비공유 전자쌍</span>
                    <div class="control-row">
                        <div class="label-text">☁ (..)</div>
                        <div class="btn-group">
                            <button class="btn-remove" onclick="removeDomain('${id}','lone')">×</button>
                            <img src="https://img.icons8.com/ios-glyphs/30/ffffff/plus-math.png" class="btn-add" onclick="addDomain('${id}','lone')">
                        </div>
                    </div>
                </div>
                <button class="clear-btn" onclick="clearAll('${id}')">모두 제거</button>
                <div class="group-box" style="margin-top:15px;">
                    <span class="group-title">선택</span>
                    <label><input type="checkbox" id="checkLone-${id}" checked onchange="updateScene('${id}')"> 비공유 전자쌍 보기</label>
                    <label><input type="checkbox" id="checkAngle-${id}" onchange="updateScene('${id}')"> 결합각 보기</label>
                    <label style="color: #00d2ff;"><input type="checkbox" id="checkRotate-${id}" onchange="toggleRotation('${id}')"> 자동 회전</label>
                </div>
            </div>
            <div class="bottom-panel ${id === 'A' ? 'left-bottom' : 'right-bottom'}">
                <div class="group-box">
                    <span class="group-title">구조 이름</span>
                    <label><input type="checkbox" id="checkEGeo-${id}" checked onchange="updateScene('${id}')"> 전자 구조</label>
                    <span id="eGeoText-${id}" class="name-label">-</span>
                    <label style="margin-top:10px;"><input type="checkbox" id="checkMGeo-${id}" checked onchange="updateScene('${id}')"> 분자 구조</label>
                    <span id="mGeoText-${id}" class="name-label">-</span>
                </div>
            </div>
        </div>
        `);
    }
    renderView('A', '1');
    renderView('B', '2');
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const state = {
        A: { domains: [], scene: null, camera: null, controls: null, group: null, renderer: null, isRotating: false },
        B: { domains: [], scene: null, camera: null, controls: null, group: null, renderer: null, isRotating: false }
    };

    const GEOMETRY_INFO = {
        1: { eName: '선형(이원자)', points: [[0,2.5,0]], angles: [0], mNames: {'0':'선형'} },
        2: { eName: '선형', points: [[0,2.5,0], [0,-2.5,0]], angles: [180], mNames: {'0':'선형'} },
        3: { eName: '평면 삼각형', points: [[0,2.5,0], [2.16,-1.25,0], [-2.16,-1.25,0]], angles: [120, 117], mNames: {'0':'평면 삼각형', '1':'굽은형'} },
        4: { eName: '정사면체', points: [[0,2.5,0], [2.35,-0.83,0], [-1.17,-0.83,2.03], [-1.17,-0.83,-2.03]], angles: [109.5, 107, 104.5], mNames: {'0':'정사면체', '1':'삼각뿔', '2':'굽은형'} },
        5: { eName: '삼각 쌍뿔', points: [[0,2.5,0], [0,-2.5,0], [2.5,0,0], [-1.25,0,2.16], [-1.25,0,-2.16]], angles: [90, 120], mNames: {'0':'삼각 쌍뿔', '1':'시소형', '2':'T자형', '3':'선형'} },
        6: { eName: '정팔면체', points: [[2.5,0,0], [-2.5,0,0], [0,2.5,0], [0,-2.5,0], [0,0,2.5], [0,0,-2.5]], angles: [90], mNames: {'0':'정팔면체', '1':'사각뿔', '2':'평면 사각형'} }
    };

    init();
    animate();

    function init() {
        ['A', 'B'].forEach(id => {
            const container = document.getElementById(`container-${id}`);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, (window.innerWidth/2) / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 10);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const light = new THREE.PointLight(0xffffff, 0.8);
            light.position.set(10, 10, 10);
            scene.add(light);

            const group = new THREE.Group();
            scene.add(group);

            state[id] = { ...state[id], scene, camera, renderer, controls, group };
            updateScene(id);
        });
        window.addEventListener('resize', onWindowResize);
    }

    function addDomain(side, type) {
        if (state[side].domains.length >= 6) return;
        if (type === 'lone') state[side].domains.push({type});
        else state[side].domains.unshift({type});
        updateScene(side);
    }

    function removeDomain(side, type) {
        const idx = state[side].domains.findIndex(d => d.type === type);
        if (idx !== -1) { state[side].domains.splice(idx, 1); updateScene(side); }
    }

    function clearAll(side) { state[side].domains = []; updateScene(side); }

    function toggleRotation(side) {
        state[side].isRotating = document.getElementById(`checkRotate-${side}`).checked;
    }

    function updateScene(side) {
        const s = state[side];
        while(s.group.children.length > 0) s.group.remove(s.group.children[0]);
        document.querySelectorAll(`.angle-tag-${side}`).forEach(t => t.remove());

        // 중심 원자
        s.group.add(new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), new THREE.MeshPhongMaterial({color: 0x8e44ad})));

        const total = s.domains.length;
        if (total === 0) { updateUI(side, "-", "-"); return; }

        const loneCount = s.domains.filter(d => d.type === 'lone').length;
        const info = GEOMETRY_INFO[total];
        const showLone = document.getElementById(`checkLone-${side}`).checked;

        s.domains.forEach((d, i) => {
            const pos = new THREE.Vector3(...info.points[i]);
            if (d.type.startsWith('bond')) {
                const order = parseInt(d.type.replace('bond', ''));
                createBond(side, order, pos);
                const atom = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), new THREE.MeshPhongMaterial({color: 0xffffff}));
                atom.position.copy(pos);
                s.group.add(atom);
            } else if (showLone) {
                createLone(side, pos);
            }
        });

        if (document.getElementById(`checkAngle-${side}`).checked && total >= 2) createAngleTag(side, info, loneCount);
        
        const eName = document.getElementById(`checkEGeo-${side}`).checked ? info.eName : "-";
        const mName = document.getElementById(`checkMGeo-${side}`).checked ? (info.mNames[loneCount] || "정의 불가") : "-";
        updateUI(side, eName, mName);
    }

    function createBond(side, order, pos) {
        const g = new THREE.Group();
        const mat = new THREE.MeshPhongMaterial({color: 0xcccccc});
        const len = pos.length();
        const offsets = order === 1 ? [0] : (order === 2 ? [-0.18, 0.18] : [-0.25, 0, 0.25]);
        offsets.forEach(o => {
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, len, 16), mat);
            cyl.position.set(o, len/2, 0);
            g.add(cyl);
        });
        g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
        state[side].group.add(g);
    }

    function createLone(side, pos) {
        const cloud = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), new THREE.MeshPhongMaterial({color: 0xffff00, transparent: true, opacity: 0.3}));
        cloud.scale.set(0.8, 1.3, 0.8);
        cloud.position.copy(pos).multiplyScalar(0.5);
        cloud.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), pos.clone().normalize());
        state[side].group.add(cloud);
        [-0.2, 0.2].forEach(x => {
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({color: 0xffff00}));
            dot.position.copy(pos).multiplyScalar(0.65);
            dot.position.x += x;
            state[side].group.add(dot);
        });
    }

    function createAngleTag(side, info, loneCount) {
        const bonds = state[side].domains.map((d, i) => d.type.startsWith('bond') ? i : -1).filter(i => i !== -1);
        if (bonds.length < 2) return;
        let val = info.angles[Math.min(loneCount, info.angles.length - 1)];
        const tag = document.createElement('div');
        tag.className = `angle-tag angle-tag-${side}`;
        tag.innerText = val + '°';
        document.getElementById(`container-${side}`).appendChild(tag);
        const p1 = new THREE.Vector3(...info.points[bonds[0]]), p2 = new THREE.Vector3(...info.points[bonds[1]]);
        tag.userData = { worldPos: p1.clone().add(p2).normalize().multiplyScalar(1.6) };
    }

    function updateUI(side, e, m) {
        document.getElementById(`eGeoText-${side}`).innerText = e;
        document.getElementById(`mGeoText-${side}`).innerText = m;
    }

    function onWindowResize() {
        ['A', 'B'].forEach(id => {
            const container = document.getElementById(`container-${id}`);
            state[id].camera.aspect = container.clientWidth / container.clientHeight;
            state[id].camera.updateProjectionMatrix();
            state[id].renderer.setSize(container.clientWidth, container.clientHeight);
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        ['A', 'B'].forEach(id => {
            const s = state[id];
            
            // 자동 회전 로직
            if (s.isRotating) {
                s.group.rotation.y += 0.01;
            }

            s.controls.update();
            s.renderer.render(s.scene, s.camera);

            document.querySelectorAll(`.angle-tag-${id}`).forEach(tag => {
                const p = tag.userData.worldPos.clone().applyQuaternion(s.group.quaternion).project(s.camera);
                const container = document.getElementById(`container-${id}`);
                tag.style.left = (p.x * 0.5 + 0.5) * container.clientWidth + 'px';
                tag.style.top = (-p.y * 0.5 + 0.5) * container.clientHeight + 'px';
            });
        });
    }
</script>
</body>
</html>
